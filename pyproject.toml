[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wineriddle-resched_jd306"
version = "0.1.0"
description = "从输入中抽取数值，计算训练资源调度工程师·函数调用的 schema 校验相关的比值与占比，分母为零时明确报错"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "wineriddle" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://wineriddle.github.io"
Repository = "https://github.com/wineriddle/resched_jd306"
Issues = "https://github.com/wineriddle/resched_jd306/issues"

[project.scripts]
resched_jd306 = "resched_jd306:main"

[tool.setuptools]
py-modules = ["resched_jd306"]
